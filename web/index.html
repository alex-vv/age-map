<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age map</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  {#bundle /}
  <script
    data-goatcounter="https://stats.age-map.ru/count"
    async
    src="https://stats.age-map.ru/count.js"
  ></script>
</head>
<body>
  <div id="map"></div>
  <div id="legend" class="legend"></div>
  <div id="controls" class="controls">
    <div class="range">
      <div class="range-title">Год постройки</div>
      <div class="range-slider">
        <div class="range-track"></div>
        <div id="range-fill" class="range-fill"></div>
        <input id="year-lo" type="range" min="1771" max="2026" step="1" value="1771" />
        <input id="year-hi" type="range" min="1771" max="2026" step="1" value="2026" />
      </div>
      <div class="range-labels">
        <span id="label-lo">1771</span>
        <span id="label-hi">2026</span>
      </div>
    </div>
    <div class="range">
      <div class="range-title">Этажность</div>
      <div class="range-slider">
        <div class="range-track"></div>
        <div id="floor-fill" class="range-fill"></div>
        <input id="floor-lo" type="range" min="0" max="23" step="1" value="0" />
        <input id="floor-hi" type="range" min="0" max="23" step="1" value="23" />
      </div>
      <div class="range-labels">
        <span id="floor-label-lo">0</span>
        <span id="floor-label-hi">23</span>
      </div>
    </div>
  </div>
</body>
</html>
