services:
  db:
    image: 'postgis/postgis:16-3.4-alpine'
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=age_map
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - age-map-pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'     

volumes:
  age-map-pgdata: